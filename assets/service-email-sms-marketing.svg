<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Email and SMS marketing system</title>
  <desc id="desc">A WTB-style campaign flow visual for email and SMS marketing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset=".62" stop-color="#12345a"/><stop offset="1" stop-color="#155dfc"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0v80" fill="none" stroke="#fff" stroke-opacity=".08"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <text x="96" y="165" fill="#fff" font-family="Arial, sans-serif" font-size="74" font-weight="800">Email/SMS conversion engine</text>
  <text x="102" y="244" fill="#c4d3e5" font-family="Arial, sans-serif" font-size="34">Capture leads, follow up, reactivate customers, and report sales action.</text>
  <g filter="url(#shadow)">
    <rect x="120" y="350" width="380" height="300" rx="34" fill="#f8fbff"/>
    <rect x="175" y="410" width="270" height="44" rx="16" fill="#155dfc"/>
    <rect x="175" y="492" width="220" height="18" fill="#07101f" opacity=".45"/>
    <rect x="175" y="532" width="270" height="18" fill="#07101f" opacity=".28"/>
    <rect x="175" y="585" width="150" height="42" rx="21" fill="#f7b51b"/>
    <rect x="610" y="305" width="330" height="410" rx="42" fill="#08182e" stroke="#6a84a8" stroke-opacity=".55"/>
    <rect x="660" y="365" width="230" height="58" rx="22" fill="#155dfc"/><rect x="660" y="460" width="190" height="38" rx="19" fill="#ffffff" opacity=".14"/><rect x="660" y="535" width="230" height="38" rx="19" fill="#ffffff" opacity=".14"/><rect x="660" y="610" width="140" height="38" rx="19" fill="#22c55e"/>
    <rect x="1050" y="350" width="430" height="300" rx="34" fill="#08182e" stroke="#6a84a8" stroke-opacity=".55"/>
    <rect x="1110" y="430" width="70" height="150" rx="16" fill="#155dfc"/><rect x="1215" y="390" width="70" height="190" rx="16" fill="#f7b51b"/><rect x="1320" y="470" width="70" height="110" rx="16" fill="#22c55e"/>
