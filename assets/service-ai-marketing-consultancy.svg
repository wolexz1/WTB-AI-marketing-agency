<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI marketing consultancy workflow</title>
  <desc id="desc">A WTB AI marketing consultancy visual showing AI tools, workflow mapping, prompts, automations, reporting, and marketing execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset=".48" stop-color="#0c2140"/>
      <stop offset="1" stop-color="#155dfc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3b51f"/>
      <stop offset="1" stop-color="#ffe38a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="44" fill="url(#bg)"/>
  <g opacity=".14" stroke="#fff">
    <path d="M90 120h1020M90 240h1020M90 360h1020M90 480h1020M90 600h1020"/>
    <path d="M180 70v650M360 70v650M540 70v650M720 70v650M900 70v650M1080 70v650"/>
  </g>
  <text x="84" y="122" fill="#7db5ff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="4">AI MARKETING CONSULTANCY</text>
  <text x="84" y="202" fill="#fff" font-family="Georgia, serif" font-size="76" font-weight="800">Turn AI tools into</text>
  <text x="84" y="286" fill="#fff" font-family="Georgia, serif" font-size="76" font-weight="800">a marketing system.</text>
  <g filter="url(#shadow)">
    <rect x="86" y="360" width="356" height="250" rx="28" fill="#ffffff" opacity=".96"/>
    <rect x="492" y="314" width="356" height="296" rx="28" fill="#ffffff" opacity=".96"/>
    <rect x="898" y="230" width="192" height="380" rx="28" fill="#ffffff" opacity=".96"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="124" y="420" fill="#155dfc" font-size="24" font-weight="900">TOOLS</text>
    <text x="124" y="475" fill="#111827" font-size="34" font-weight="900">ChatGPT, Claude,</text>
    <text x="124" y="516" fill="#111827" font-size="34" font-weight="900">Codex, Gemini</text>
    <text x="124" y="560" fill="#4b5563" font-size="22">prompts and workflows</text>
    <text x="530" y="374" fill="#155dfc" font-size="24" font-weight="900">PROCESS</text>
    <text x="530" y="430" fill="#111827" font-size="34" font-weight="900">Research, content,</text>
    <text x="530" y="471" fill="#111827" font-size="34" font-weight="900">ads and reporting</text>
    <text x="530" y="516" fill="#4b5563" font-size="22">mapped for your team</text>
    <text x="940" y="292" fill="#155dfc" font-size="24" font-weight="900">RESULT</text>
    <text x="940" y="358" fill="#111827" font-size="45" font-weight="900">Fast</text>
    <text x="940" y="418" fill="#111827" font-size="45" font-weight="900">Clear</text>
    <text x="940" y="478" fill="#111827" font-size="45" font-weight="900">Sharp</text>
  </g>
  <path d="M288 360c120-86 260-106 405-30 94 50 164 46 252-18" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="1010" cy="642" r="52" fill="#f3b51f"/>
  <path d="M986 642l19 20 40-54" fill="none" stroke="#07101d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
