  <text x="116" y="145" fill="#155dfc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="4">ABUJA GROWTH SYSTEM</text>
  <text x="116" y="230" fill="#15171c" font-family="Georgia, serif" font-size="72" font-weight="800">AI-assisted</text>
  <text x="116" y="306" fill="#15171c" font-family="Georgia, serif" font-size="72" font-weight="800">marketing for</text>
  <text x="116" y="382" fill="#15171c" font-family="Georgia, serif" font-size="72" font-weight="800">serious brands.</text>
  <text x="116" y="458" fill="#4b5563" font-family="Inter, Arial, sans-serif" font-size="26">Strategy, content, ads, SEO, creators,</text>
  <text x="116" y="496" fill="#4b5563" font-family="Inter, Arial, sans-serif" font-size="26">and reporting connected through one</text>
  <text x="116" y="534" fill="#4b5563" font-family="Inter, Arial, sans-serif" font-size="26">faster execution workflow.</text>
