  <path d="M120 640c170-90 330-72 485-35 158 38 303 80 482-40" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="1032" cy="588" r="50" fill="#f3b51f"/>
  <path d="M1008 590l18 18 38-50" fill="none" stroke="#08111f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
