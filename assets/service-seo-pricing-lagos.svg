<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SEO pricing Lagos planning board</title>
  <desc id="desc">A WTB style visual showing SEO pricing, keyword intent, technical setup, local SEO, and reporting for Lagos businesses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".55" stop-color="#0c2140"/>
      <stop offset="1" stop-color="#155dfc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f3b51f"/>
      <stop offset="1" stop-color="#ffe38a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg)"/>
  <g opacity=".16" stroke="#fff">
    <path d="M80 120h1040M80 220h1040M80 320h1040M80 420h1040M80 520h1040M80 620h1040"/>
    <path d="M160 80v600M320 80v600M480 80v600M640 80v600M800 80v600M960 80v600"/>
  </g>
  <text x="84" y="112" fill="#7db5ff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="4">SEO PRICING LAGOS</text>
  <text x="84" y="188" fill="#fff" font-family="Georgia, serif" font-size="72" font-weight="800">Budget for search</text>
  <text x="84" y="260" fill="#fff" font-family="Georgia, serif" font-size="72" font-weight="800">visibility that sells.</text>
  <g filter="url(#shadow)">
    <rect x="84" y="340" width="310" height="230" rx="24" fill="#ffffff" opacity=".96"/>
    <rect x="445" y="290" width="310" height="280" rx="24" fill="#ffffff" opacity=".96"/>
    <rect x="806" y="235" width="310" height="335" rx="24" fill="#ffffff" opacity=".96"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="120" y="394" fill="#155dfc" font-size="25" font-weight="900">AUDIT</text>
    <text x="120" y="452" fill="#111827" font-size="46" font-weight="900">160k+</text>
    <text x="120" y="500" fill="#4b5563" font-size="23">keywords, pages,</text>
    <text x="120" y="532" fill="#4b5563" font-size="23">technical checks</text>
    <text x="482" y="345" fill="#155dfc" font-size="25" font-weight="900">MONTHLY</text>
    <text x="482" y="410" fill="#111827" font-size="46" font-weight="900">250k+</text>
    <text x="482" y="462" fill="#4b5563" font-size="23">local SEO, content,</text>
    <text x="482" y="494" fill="#4b5563" font-size="23">optimization</text>
    <text x="844" y="292" fill="#155dfc" font-size="25" font-weight="900">COMPETITIVE</text>
    <text x="844" y="360" fill="#111827" font-size="46" font-weight="900">450k+</text>
    <text x="844" y="412" fill="#4b5563" font-size="23">deeper content,</text>
    <text x="844" y="444" fill="#4b5563" font-size="23">technical growth,</text>
    <text x="844" y="476" fill="#4b5563" font-size="23">ecommerce SEO</text>
