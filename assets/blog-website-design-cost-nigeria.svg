  <text x="840" y="368" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">WHAT DRIVES PRICE</text>
  <rect x="840" y="404" width="232" height="72" rx="22" fill="#FFF4D9"/>
  <text x="876" y="448" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Page count</text>
  <rect x="1094" y="404" width="232" height="72" rx="22" fill="#EEF4FF"/>
  <text x="1148" y="448" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Ecommerce</text>
  <rect x="840" y="496" width="232" height="72" rx="22" fill="#EEF4FF"/>
  <text x="906" y="540" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">SEO setup</text>
