  <rect x="196" y="434" width="160" height="16" rx="8" fill="#145EFF"/>
  <rect x="196" y="466" width="272" height="16" rx="8" fill="#D3E0FF"/>
  <rect x="196" y="498" width="232" height="16" rx="8" fill="#D3E0FF"/>
  <rect x="196" y="530" width="188" height="16" rx="8" fill="#D3E0FF"/>
