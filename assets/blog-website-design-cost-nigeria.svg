  <text x="128" y="156" fill="#145EFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">WTB BLOG COVER</text>
  <text x="128" y="218" fill="#111111" font-family="Georgia, serif" font-size="54" font-weight="700">How Much Does Website Design Cost in Nigeria?</text>
  <text x="128" y="260" fill="#576072" font-family="Inter, Arial, sans-serif" font-size="26">The cost depends on page count, ecommerce, SEO, and what the build actually needs.</text>
  <rect x="128" y="316" width="610" height="350" rx="28" fill="#EEF4FF" stroke="#C9DBFF" stroke-width="2"/>
