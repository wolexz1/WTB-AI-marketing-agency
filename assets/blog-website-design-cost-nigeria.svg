<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Website design cost planning cover</title>
  <desc id="desc">A branded website budget and wireframe planning illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".65" stop-color="#102f52"/><stop offset="1" stop-color="#155dfc"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0v80" fill="none" stroke="#fff" stroke-opacity=".08"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <text x="100" y="175" fill="#fff" font-family="Arial, sans-serif" font-size="76" font-weight="800">Website cost planning</text>
  <text x="105" y="252" fill="#c2d1e2" font-family="Arial, sans-serif" font-size="34">Pages, features, domain, SEO, ecommerce,</text>
  <text x="105" y="298" fill="#c2d1e2" font-family="Arial, sans-serif" font-size="34">and launch budget in one clean brief.</text>
  <rect x="92" y="372" width="585" height="382" rx="32" fill="#08182e" stroke="#6d83a2" stroke-opacity=".5" filter="url(#shadow)"/>
  <g font-family="Arial, sans-serif" font-size="26" fill="#fff">
    <text x="140" y="430">Business pages</text><rect x="140" y="454" width="390" height="32" rx="16" fill="#155dfc"/>
    <text x="140" y="526">SEO setup</text><rect x="140" y="550" width="250" height="32" rx="16" fill="#f7b51b"/>
    <text x="140" y="622">Ecommerce</text><rect x="140" y="646" width="456" height="32" rx="16" fill="#22c55e"/>
    <text x="140" y="718">Domain + email</text><rect x="140" y="742" width="315" height="32" rx="16" fill="#155dfc"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="795" y="120" width="642" height="250" rx="30" fill="#f8fbff"/>
    <rect x="845" y="168" width="542" height="45" rx="12" fill="#155dfc"/><rect x="845" y="250" width="456" height="16" fill="#07101f" opacity=".55"/><rect x="845" y="288" width="340" height="16" fill="#07101f" opacity=".35"/>
    <rect x="795" y="450" width="292" height="282" rx="30" fill="#f8fbff"/>
    <rect x="833" y="495" width="216" height="76" rx="16" fill="#f7b51b"/><rect x="833" y="616" width="190" height="14" fill="#07101f" opacity=".5"/><rect x="833" y="648" width="134" height="14" fill="#07101f" opacity=".32"/>
    <rect x="1145" y="450" width="292" height="282" rx="30" fill="#f8fbff"/>
    <rect x="1183" y="495" width="216" height="76" rx="16" fill="#155dfc"/><rect x="1183" y="616" width="190" height="14" fill="#07101f" opacity=".5"/><rect x="1183" y="648" width="134" height="14" fill="#07101f" opacity=".32"/>
  </g>
  <text x="875" y="810" fill="#f7b51b" font-family="Arial, sans-serif" font-size="48" font-weight="800">Specific budget, specific scope</text>
</svg>
