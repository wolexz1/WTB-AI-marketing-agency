  <text x="1142" y="540" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Domain + hosting</text>
  <text x="128" y="736" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Quick insight:</text>
  <text x="315" y="736" fill="#576072" font-family="Inter, Arial, sans-serif" font-size="28">A simple site is one thing. A sales-ready site with SEO, forms, content, and ecommerce costs more for good reason.</text>
