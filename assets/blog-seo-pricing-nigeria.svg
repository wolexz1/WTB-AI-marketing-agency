  <text x="128" y="156" fill="#145EFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">WTB BLOG COVER</text>
  <text x="128" y="218" fill="#111111" font-family="Georgia, serif" font-size="54" font-weight="700">SEO Pricing in Nigeria</text>
  <text x="128" y="260" fill="#576072" font-family="Inter, Arial, sans-serif" font-size="26">The image explains the three common budget levels: audit, monthly growth, and competitive SEO.</text>
  <rect x="128" y="318" width="400" height="344" rx="30" fill="#EEF4FF" stroke="#C9DBFF" stroke-width="2"/>
