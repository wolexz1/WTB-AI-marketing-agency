  <text x="210" y="432" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">one-time foundation check</text>
  <rect x="164" y="476" width="292" height="18" rx="9" fill="#145EFF"/>
  <rect x="164" y="512" width="248" height="18" rx="9" fill="#BFD2FF"/>
  <text x="164" y="586" fill="#576072" font-family="Inter, Arial, sans-serif" font-size="22">Best when you need clarity before a bigger SEO push.</text>
  <rect x="600" y="318" width="400" height="344" rx="30" fill="#FFF4D9" stroke="#E7D7A7" stroke-width="2"/>
  <text x="636" y="378" fill="#C18E06" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">MONTHLY SEO</text>
