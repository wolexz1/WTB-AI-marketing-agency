  <text x="720" y="432" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">ongoing content and optimisation</text>
  <rect x="636" y="476" width="308" height="18" rx="9" fill="#C18E06"/>
  <rect x="636" y="512" width="262" height="18" rx="9" fill="#F3D37A"/>
  <text x="636" y="586" fill="#576072" font-family="Inter, Arial, sans-serif" font-size="22">Best when you want steady growth, reporting, and stronger visibility.</text>
  <rect x="1072" y="318" width="304" height="344" rx="30" fill="#F1ECFF" stroke="#D5CAFF" stroke-width="2"/>
  <text x="1108" y="378" fill="#6E56CF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">COMPETITIVE SEO</text>
  <text x="1108" y="432" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">₦₦₦</text>
  <text x="1108" y="480" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">harder keywords, more content, more technical work</text>
