<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Influencer marketing campaign system</title>
  <desc id="desc">A WTB-style creator campaign planning visual.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset=".6" stop-color="#102c50"/><stop offset="1" stop-color="#155dfc"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0v80" fill="none" stroke="#fff" stroke-opacity=".08"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <text x="96" y="165" fill="#fff" font-family="Arial, sans-serif" font-size="74" font-weight="800">Influencer campaign map</text>
  <text x="102" y="244" fill="#c4d3e5" font-family="Arial, sans-serif" font-size="34">Find the right creators, briefs, content angles, posting flow, and proof.</text>
  <g filter="url(#shadow)">
    <circle cx="800" cy="485" r="118" fill="#22c55e"/><text x="738" y="508" fill="#07101f" font-family="Arial, sans-serif" font-size="52" font-weight="900">WTB</text>
    <circle cx="355" cy="335" r="82" fill="#f8fbff"/><circle cx="355" cy="315" r="28" fill="#155dfc"/><rect x="300" y="360" width="110" height="32" rx="16" fill="#f7b51b"/>
    <circle cx="540" cy="680" r="82" fill="#f8fbff"/><circle cx="540" cy="660" r="28" fill="#f7b51b"/><rect x="485" y="705" width="110" height="32" rx="16" fill="#155dfc"/>
    <circle cx="1070" cy="680" r="82" fill="#f8fbff"/><circle cx="1070" cy="660" r="28" fill="#155dfc"/><rect x="1015" y="705" width="110" height="32" rx="16" fill="#22c55e"/>
    <circle cx="1245" cy="335" r="82" fill="#f8fbff"/><circle cx="1245" cy="315" r="28" fill="#f7b51b"/><rect x="1190" y="360" width="110" height="32" rx="16" fill="#155dfc"/>
    <rect x="640" y="135" width="320" height="130" rx="28" fill="#08182e" stroke="#6a84a8" stroke-opacity=".55"/>
    <text x="695" y="215" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="800">Creator brief</text>
  </g>
  <g stroke="#fff" stroke-opacity=".28" stroke-width="4"><line x1="715" y1="430" x2="420" y2="360"/><line x1="735" y1="565" x2="590" y2="635"/><line x1="880" y1="565" x2="1020" y2="635"/><line x1="890" y1="430" x2="1180" y2="360"/><line x1="800" y1="365" x2="800" y2="265"/></g>
</svg>
